<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b3d"/>
      <stop offset="100%" stop-color="#1e2c52"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.45">
      <stop offset="0%" stop-color="#c4a456" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#c4a456" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.9" r="0.4">
      <stop offset="0%" stop-color="#c4a456" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c4a456" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Logo CD -->
  <g transform="translate(80,80)">
    <rect width="72" height="72" rx="14" fill="#0a1228"/>
    <text x="36" y="51" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-weight="700" font-size="38" fill="#c4a456">CD</text>
  </g>

  <!-- Wordmark -->
  <text x="170" y="124" font-family="Cormorant Garamond, Georgia, serif" font-weight="600" font-size="32" fill="#fbf9f4">ClairDossier</text>

  <!-- Eyebrow -->
  <text x="80" y="250" font-family="JetBrains Mono, monospace" font-weight="500" font-size="20" fill="#c4a456" letter-spacing="4">LEGALTECH · PME · ARTISANS · INDÉPENDANTS</text>

  <!-- H1 (identique au Hero du site) -->
  <text x="80" y="322" font-family="Cormorant Garamond, Georgia, serif" font-weight="600" font-size="66" fill="#fbf9f4" letter-spacing="-1.5">Votre dossier administratif</text>
  <text x="80" y="392" font-family="Cormorant Garamond, Georgia, serif" font-weight="600" font-size="66" fill="#fbf9f4" letter-spacing="-1.5">et juridique, clair,</text>
  <text x="80" y="462" font-family="Cormorant Garamond, Georgia, serif" font-weight="600" font-size="66" fill="#fbf9f4" letter-spacing="-1.5"><tspan fill="#c4a456">structuré</tspan> et suivi.</text>

  <!-- Sub -->
  <text x="80" y="520" font-family="Inter, sans-serif" font-weight="400" font-size="24" fill="#a3aab9">Plateforme legaltech française · Conçue pour le RGPD</text>

  <!-- Gold hairline -->
  <line x1="80" y1="552" x2="200" y2="552" stroke="#c4a456" stroke-width="2"/>

  <!-- URL -->
  <text x="80" y="588" font-family="JetBrains Mono, monospace" font-weight="400" font-size="18" fill="#7c8497">clair-dossier.com</text>
</svg>
