<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0d1b3d" />
    <title>ClairDossier — hors connexion</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: #fbf9f4; color: #0d1b3d; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); }
      main { max-width: 26rem; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font: 600 1.6rem/1.2 Georgia, "Times New Roman", serif; margin: 20px 0 8px; }
      p { margin: 0 0 20px; color: #475569; }
      button { min-height: 44px; padding: 10px 22px; border: 0; border-radius: 999px; background: #0d1b3d; color: #fbf9f4; font: 600 15px system-ui, sans-serif; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Vous êtes hors connexion</h1>
      <p>Vos dossiers restent sur nos serveurs sécurisés : rien n'est conservé sur cet appareil. Reconnectez-vous à Internet pour les retrouver.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
