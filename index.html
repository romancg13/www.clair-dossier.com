<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1b3d" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="light" />
    <meta name="google-site-verification" content="yKED4w0FJ9KypEjb814a_MoyCkGpPRjWR8KVPEhDQ7c" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="canonical" href="https://www.clair-dossier.com/" />

    <!-- Default meta — overridden per route by the Seo component once JS mounts. -->
    <title>ClairDossier — Votre dossier administratif et juridique, clair, structuré et suivi.</title>
    <meta name="description" content="ClairDossier réunit vos pièces dans un espace privé, structure vos dossiers administratifs et juridiques et affiche vos échéances. Rien ne part sans validation." />
    <meta name="author" content="ClairDossier" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph defaults -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ClairDossier" />
    <meta property="og:title" content="ClairDossier — Votre dossier administratif et juridique, clair, structuré et suivi." />
    <meta property="og:description" content="Plateforme legaltech française pour les PME, artisans, entreprises individuelles et professions libérales : pièces réunies, dossiers structurés, échéances suivies." />
    <meta property="og:url" content="https://www.clair-dossier.com/" />
    <meta property="og:image" content="https://www.clair-dossier.com/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClairDossier — Votre dossier administratif et juridique, clair, structuré et suivi." />
    <meta name="twitter:description" content="Plateforme legaltech française pour PME, artisans, indépendants et professions libérales." />
    <meta name="twitter:image" content="https://www.clair-dossier.com/og-default.jpg" />

    <!-- Anti-FOIT : font-display: swap déjà fourni par @fontsource. Le navigateur
         affiche la fallback sans bloquer puis swap quand Cormorant arrive. -->
  </head>
  <body class="bg-cream-50 text-ink antialiased">
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; color: #0d1b3d; max-width: 640px; margin: 2rem auto; line-height: 1.6;">
        <p style="font-family: serif; font-size: 1.8rem; font-weight: 600; margin: 0 0 1rem;">ClairDossier</p>
        <p>
          L'espace client (connexion, compte, dossiers) nécessite JavaScript
          pour fonctionner. Veuillez activer JavaScript dans votre navigateur ou
          écrire à <a href="mailto:contact.clairdossier@icloud.com">contact.clairdossier@icloud.com</a>
          pour toute demande.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
