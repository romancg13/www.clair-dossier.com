# Surveillance quotidienne hébergée : site public, paiements gelés, état du
# moteur IA. Lecture seule — ne modifie rien, aucun secret — à une exception près :
# après la fin de la campagne DROIT10_2026 (09/11/2027 12:00 UTC), si l'accueil servi
# annonce encore l'offre, ce job relance deploy.yml (reconstruction du HTML statique).
# Un échec (= action requise) déclenche la notification GitHub habituelle.
name: Surveillance

on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # actions: write — relance de deploy.yml si le HTML prérendu annonce encore DROIT10_2026 après sa fin.
  actions: write

jobs:
  surveiller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Paiements gelés (fichiers et liens)
        run: node --import tsx --test tests/paiements-geles.test.ts
      - name: Site public et moteur IA
        run: node scripts/surveillance-site.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Campagne DROIT10_2026 (src/data/campagnes.ts) : après le 09/11/2027 12:00 UTC, si l'accueil servi
      # contient encore l'encart (cron de deploy.yml retardé ou désactivé), relancer le déploiement.
      - name: Expiration DROIT10_2026 (filet de sécurité du cron de deploy.yml)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d 2027-11-09T12:00:00Z +%s)" ] && curl -fsS https://www.clair-dossier.com/ | grep -q 'offre-clairnova-titre'; then
            echo 'Encart DROIT10_2026 encore servi après la fin : reconstruction demandée.'
            gh workflow run deploy.yml --ref main
          else
            echo 'DROIT10_2026 : rien à faire.'
          fi
