name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Deploys to Netlify only when the two secrets are present.
      # An admin must add them under Settings → Secrets and variables → Actions:
      #   NETLIFY_SITE_ID    = 7043ca31-cc42-4222-9a29-7c2982987109
      #   NETLIFY_AUTH_TOKEN = a Netlify personal access token
      # Until then the job still runs and verifies the build, but skips the deploy.
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID not set — build verified, deploy skipped."
            exit 0
          fi
          npx netlify-cli@latest deploy --prod --dir=dist --message "CI deploy ${GITHUB_SHA::7}"
