name: Deploy to GitHub Pages

# Le domaine clair-dossier.com pointe (DNS chez whois.com) vers GitHub Pages.
# Tant que le DNS n'est pas basculé vers Netlify, on publie le site sur Pages
# pour que le domaine serve la version à jour. (Netlify reste déployé en parallèle
# sur clair-dossier.netlify.app comme cible finale.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /
          # Clés Supabase PUBLIQUES (anon) — conçues pour le client, protégées par RLS.
          VITE_SUPABASE_URL: https://buzgokfmxpmyceppvjpp.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1emdva2ZteHBteWNlcHB2anBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NDk5NjksImV4cCI6MjA5NzEyNTk2OX0.MBRiuEYKl-b4_dNYpWKjWRm8qaFAXfwHjyAvf3Kzn2U

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
