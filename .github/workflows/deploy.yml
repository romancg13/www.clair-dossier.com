name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_FUNCTIONS_URL: ${{ secrets.VITE_SUPABASE_FUNCTIONS_URL }}
          VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY }}
          VITE_STRIPE_CLIENT_ESSENTIEL_MONTHLY_PRICE_ID: ${{ secrets.VITE_STRIPE_CLIENT_ESSENTIEL_MONTHLY_PRICE_ID }}
          VITE_STRIPE_CLIENT_ESSENTIEL_YEARLY_PRICE_ID: ${{ secrets.VITE_STRIPE_CLIENT_ESSENTIEL_YEARLY_PRICE_ID }}
          VITE_STRIPE_BUSINESS_MONTHLY_PRICE_ID: ${{ secrets.VITE_STRIPE_BUSINESS_MONTHLY_PRICE_ID }}
          VITE_STRIPE_BUSINESS_YEARLY_PRICE_ID: ${{ secrets.VITE_STRIPE_BUSINESS_YEARLY_PRICE_ID }}
          VITE_STRIPE_CABINET_SOLO_MONTHLY_PRICE_ID: ${{ secrets.VITE_STRIPE_CABINET_SOLO_MONTHLY_PRICE_ID }}
          VITE_STRIPE_CABINET_SOLO_YEARLY_PRICE_ID: ${{ secrets.VITE_STRIPE_CABINET_SOLO_YEARLY_PRICE_ID }}
          VITE_STRIPE_CABINET_PRO_MONTHLY_PRICE_ID: ${{ secrets.VITE_STRIPE_CABINET_PRO_MONTHLY_PRICE_ID }}
          VITE_STRIPE_CABINET_PRO_YEARLY_PRICE_ID: ${{ secrets.VITE_STRIPE_CABINET_PRO_YEARLY_PRICE_ID }}
          VITE_STRIPE_CABINET_PREMIUM_MONTHLY_PRICE_ID: ${{ secrets.VITE_STRIPE_CABINET_PREMIUM_MONTHLY_PRICE_ID }}
          VITE_STRIPE_CABINET_PREMIUM_YEARLY_PRICE_ID: ${{ secrets.VITE_STRIPE_CABINET_PREMIUM_YEARLY_PRICE_ID }}

      - name: Verify GitHub Pages artifact
        run: |
          node -e "const fs=require('fs'); const html=fs.readFileSync('dist/index.html','utf8'); if (html.includes('/src/main.tsx')) throw new Error('dist/index.html still references /src/main.tsx'); if (!html.includes('/assets/')) throw new Error('dist/index.html does not reference built assets'); for (const file of ['dist/404.html','dist/manifest.json','dist/icon.svg','dist/CNAME']) { if (!fs.existsSync(file)) throw new Error(`${file} is missing from the Pages artifact`); }"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy built artifact
        id: deployment
        uses: actions/deploy-pages@v4
