name: Deploy to GitHub Pages

# Le domaine clair-dossier.com pointe (DNS chez whois.com) vers GitHub Pages.
# Tant que le DNS n'est pas basculé vers Netlify, on publie le site sur Pages
# pour que le domaine serve la version à jour. (Netlify reste déployé en parallèle
# sur clair-dossier.netlify.app comme cible finale.)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Campagne DROIT10_2026 (src/data/campagnes.ts), lancée le 06/11/2026 : reconstruction du HTML
  # prérendu juste après la FIN — 9 novembre 2027, 12:05 UTC = 13:05 Paris. (Un cron n'a pas d'année :
  # l'exécution du 09/11/2026 ne fait qu'un rebuild identique, sans effet.) Le navigateur applique déjà
  # la fin à la seconde ; surveillance.yml relance ce déploiement si ce cron n'a pas tourné.
  schedule:
    - cron: '5 12 9 11 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : le sitemap date chaque page par le dernier
          # commit de ses sources (lastmod réel, jamais la date du build).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/configure-pages@v5

      - run: npm ci

      # Garde-fous : une régression TypeScript, de tests (SEO, routes,
      # cinématiques) ou de pré-rendu bloque le déploiement.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: node --import tsx --test tests/*.test.ts

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /
          # Clés Supabase PUBLIQUES (anon) — conçues pour le client, protégées par RLS.
          VITE_SUPABASE_URL: https://buzgokfmxpmyceppvjpp.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1emdva2ZteHBteWNlcHB2anBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NDk5NjksImV4cCI6MjA5NzEyNTk2OX0.MBRiuEYKl-b4_dNYpWKjWRm8qaFAXfwHjyAvf3Kzn2U
          # Lien PUBLIC du portail client Stripe (factures, abonnement) — variable de dépôt, facultative.
          VITE_STRIPE_PORTAL_URL: ${{ vars.VITE_STRIPE_PORTAL_URL }}
          # Mesure d'audience sans cookie (Plausible) — domaine PUBLIC du site, pas un secret.
          # Étiquette "data-domain" : doit être IDENTIQUE au nom du site dans le
          # compte Plausible. Aligné sur le domaine canonique servi (www).
          VITE_PLAUSIBLE_DOMAIN: www.clair-dossier.com

      # Repère de version public (aucun secret) : prouve quel commit est servi
      # par le domaine — https://www.clair-dossier.com/version.json
      - name: Version marker
        run: printf '{"commit":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/version.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
