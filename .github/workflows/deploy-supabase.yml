name: Deploy Supabase Stripe Functions

on:
  workflow_dispatch:

jobs:
  deploy-supabase:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push database migrations
        if: env.SUPABASE_DB_PASSWORD != ''
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Stripe Edge Functions
        run: |
          supabase functions deploy create-checkout-session --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy stripe-webhook --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy customer-portal --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy ai-blog-assistant --project-ref "$SUPABASE_PROJECT_REF"
