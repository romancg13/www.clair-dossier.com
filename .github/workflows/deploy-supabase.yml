name: Deploy Supabase Stripe Functions

on:
  workflow_dispatch:

jobs:
  deploy-supabase:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      SITE_URL: ${{ secrets.SITE_URL }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      STRIPE_CLIENT_ESSENTIEL_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_CLIENT_ESSENTIEL_MONTHLY_PRICE_ID }}
      STRIPE_CLIENT_ESSENTIEL_YEARLY_PRICE_ID: ${{ secrets.STRIPE_CLIENT_ESSENTIEL_YEARLY_PRICE_ID }}
      STRIPE_BUSINESS_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_BUSINESS_MONTHLY_PRICE_ID }}
      STRIPE_BUSINESS_YEARLY_PRICE_ID: ${{ secrets.STRIPE_BUSINESS_YEARLY_PRICE_ID }}
      STRIPE_CABINET_SOLO_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_CABINET_SOLO_MONTHLY_PRICE_ID }}
      STRIPE_CABINET_SOLO_YEARLY_PRICE_ID: ${{ secrets.STRIPE_CABINET_SOLO_YEARLY_PRICE_ID }}
      STRIPE_CABINET_PRO_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_CABINET_PRO_MONTHLY_PRICE_ID }}
      STRIPE_CABINET_PRO_YEARLY_PRICE_ID: ${{ secrets.STRIPE_CABINET_PRO_YEARLY_PRICE_ID }}
      STRIPE_CABINET_PREMIUM_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_CABINET_PREMIUM_MONTHLY_PRICE_ID }}
      STRIPE_CABINET_PREMIUM_YEARLY_PRICE_ID: ${{ secrets.STRIPE_CABINET_PREMIUM_YEARLY_PRICE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$STRIPE_SECRET_KEY"
          test -n "$STRIPE_WEBHOOK_SECRET"
          test -n "$SITE_URL"
          test -n "$ALLOWED_ORIGINS"
          test -n "$STRIPE_CLIENT_ESSENTIEL_MONTHLY_PRICE_ID"
          test -n "$STRIPE_CLIENT_ESSENTIEL_YEARLY_PRICE_ID"
          test -n "$STRIPE_BUSINESS_MONTHLY_PRICE_ID"
          test -n "$STRIPE_BUSINESS_YEARLY_PRICE_ID"
          test -n "$STRIPE_CABINET_SOLO_MONTHLY_PRICE_ID"
          test -n "$STRIPE_CABINET_SOLO_YEARLY_PRICE_ID"
          test -n "$STRIPE_CABINET_PRO_MONTHLY_PRICE_ID"
          test -n "$STRIPE_CABINET_PRO_YEARLY_PRICE_ID"

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push database migrations
        if: env.SUPABASE_DB_PASSWORD != ''
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Configure Edge Function secrets
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
            STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
            STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" \
            SITE_URL="$SITE_URL" \
            ALLOWED_ORIGINS="$ALLOWED_ORIGINS" \
            STRIPE_CLIENT_ESSENTIEL_MONTHLY_PRICE_ID="$STRIPE_CLIENT_ESSENTIEL_MONTHLY_PRICE_ID" \
            STRIPE_CLIENT_ESSENTIEL_YEARLY_PRICE_ID="$STRIPE_CLIENT_ESSENTIEL_YEARLY_PRICE_ID" \
            STRIPE_BUSINESS_MONTHLY_PRICE_ID="$STRIPE_BUSINESS_MONTHLY_PRICE_ID" \
            STRIPE_BUSINESS_YEARLY_PRICE_ID="$STRIPE_BUSINESS_YEARLY_PRICE_ID" \
            STRIPE_CABINET_SOLO_MONTHLY_PRICE_ID="$STRIPE_CABINET_SOLO_MONTHLY_PRICE_ID" \
            STRIPE_CABINET_SOLO_YEARLY_PRICE_ID="$STRIPE_CABINET_SOLO_YEARLY_PRICE_ID" \
            STRIPE_CABINET_PRO_MONTHLY_PRICE_ID="$STRIPE_CABINET_PRO_MONTHLY_PRICE_ID" \
            STRIPE_CABINET_PRO_YEARLY_PRICE_ID="$STRIPE_CABINET_PRO_YEARLY_PRICE_ID" \
            STRIPE_CABINET_PREMIUM_MONTHLY_PRICE_ID="$STRIPE_CABINET_PREMIUM_MONTHLY_PRICE_ID" \
            STRIPE_CABINET_PREMIUM_YEARLY_PRICE_ID="$STRIPE_CABINET_PREMIUM_YEARLY_PRICE_ID"
          if [ -n "$AI_API_KEY" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" AI_API_KEY="$AI_API_KEY"
          fi

      - name: Deploy Stripe Edge Functions
        run: |
          supabase functions deploy create-checkout-session --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy stripe-webhook --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy customer-portal --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy ai-blog-assistant --project-ref "$SUPABASE_PROJECT_REF"
